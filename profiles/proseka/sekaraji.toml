# ---------------------------------------------------------------------------
# No [[speakers.cast]] here on purpose. The host pair rotates every episode
# (the show calls it ユニットシャッフル), so who is on mic is per-episode data
# and belongs in the project's speaker_map.toml — which is also what drives the
# subtitle colours and the radio overlay cards. build_speaker_prompt() turns
# that map into a "Speakers in this recording" fragment, so the translator gets
# the hosts from there. This matches how Lieraji is set up: no cast in the
# profile, one speaker_map.toml per episode folder.
#
# Corners below were recovered from episode 72's YouTube auto-captions. Verify
# and extend them against a second episode before treating them as settled.
# ---------------------------------------------------------------------------

[[corners]]
name = "Opening Talk"
description = "Unstructured chat at the very top of the episode, before the show formally starts. Opens with both hosts greeting listeners and introducing themselves by character and VA name, then drifts into whatever the two of them feel like talking about. Ends when a host calls the show to order with a よろしくお願いします and the sponsor credit is read."
cues = [
    "皆さんこんばんは",
    "役の",
    "キャストがお届けするラジオ番組セカラジ",
    "今回はこの2人でお届けします",
]

[[corners]]
name = "Contact Notebook"
description = "連絡ノート. The show's relay segment: the previous episode's hosts left a question in the notebook, and this episode's hosts read it out and answer it at length. Comes right after the sponsor credit and the hosts' second self-introduction. A matching bookend appears in the Ending, where the hosts leave a question for the NEXT pair — that later half is part of the Ending, not this corner."
# Bare "連絡ノート" is deliberately not a cue: the hosts refer to the notebook in
# passing during other corners, and it pulled a false Contact Notebook boundary at
# 08:52 of episode 72.
# The sponsor credit used to be a cue here. It is not: across episodes 69-72 it
# reads at the very END of every episode, and only sometimes also at the notebook,
# so it pulled a false Contact Notebook boundary onto the sign-off every time.
# Episode 69 says 連絡ノート"の"質問, episode 70/72 say 連絡ノート"に"質問, so both
# particles are matched and the trailing conjugation is left off.
cues = [
    "連絡ノートに質問が届",
    "連絡ノートの質問が届",
]

[[corners]]
name = "Listener Mail"
description = "General listener mail (お便り) with no set theme, read early in the show. Hosts announce they are moving on to mail, then read letters one at a time, each introduced by the sender's radio name. Distinct from Theme Mail, which is announced with an explicit theme for the episode."
# Bare "ラジオネーム" is deliberately not a cue. Every letter in Theme Mail is also
# introduced by a radio name, and the Ending says "ラジオネームもお忘れなく" — between
# them they pulled three false Listener Mail boundaries in episode 72.
# Each episode announces this corner differently, so all four observed openings
# are listed; only one fires per episode. The closing solicitation is included as
# a boundary too — it is the most reliable marker of the corner, appearing in
# three of the four episodes surveyed.
cues = [
    "お便りもご紹介していきたい",
    "お便りを紹介していきます",
    "お便りも届いています",
    "お便りは以上",
    "プロセカキャストに聞いてみたい質問やテーマ",
]

[[corners]]
name = "Song"
description = "One song is played in full, mid-episode. A host introduces it — often noting which character it belongs to — and hands off with an お聞きください, after which the audio is entirely music. There is no talking over it. Lines inside this span are sung lyrics, not dialogue."
cues = [
    "ここで1曲お届けします",
    "1曲お届けします",
    "それではお聞きください",
    "この曲は",
]

[[corners]]
name = "Theme Mail"
description = "The main mail corner, built around a theme announced for this episode. The hosts state the theme, work through submissions, and close by thanking listeners and naming the theme again. Distinct from Listener Mail by the explicit テーマ framing. Observed themes: 私の宝物 (ep69), 暑い夏の対策 (ep70), お家時間の過ごし方 (ep71), 秋に楽しみなこと (ep72) — the theme is always restated at the close as ...というテーマでお届けしました."
cues = [
    "今回はこんなテーマでメールを募集しました",
    "というテーマでお届けしました",
    "早速メールを紹介していきます",
    "今回のご紹介は以上です",
    "今回の紹介は以上です",
]

[[corners]]
name = "Ending"
description = "Sign-off block. Announces the ending, gives the submission address and where to find details, previews the next episode's unit shuffle, and has the hosts record a new question in the contact notebook for the next pair of hosts. Closes with the hosts naming themselves one last time and a バイバイ, then the sponsor credit."
cues = [
    "セカラジエンディングです",
    "番組では皆さんからの投稿をお待ちしています",
    "ラジオネームもお忘れなく",
    "次回のキャストさんに向けて連絡ノートにコメントを残していきたい",
    "ここまでのお相手は",
    "お別れです",
    "お別れのお時間",
    "バイバイ",
]
