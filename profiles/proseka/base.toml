# Project Sekai game knowledge, shared by every ProSeka show.
#
# This holds only what is true of the game itself — vocabulary, glossary, and the
# transcript normalizer. Show-specific framing (prompt, corners, cast) belongs in the
# profile for that show:
#
#   proseka/base
#    ├── proseka/aftertalk   solo-host event recap livestream
#    └── proseka/sekaraji    two-host biweekly web radio
#
# Nothing here should mention a specific program.

prompt = """
ProSeka translation rules — these hold for any Project Sekai program:
1. Preserve third-person self-reference. When a host refers to themselves by their own name or their character's name (みのり, エナ), keep it in English ("Minori will be talking", not "I'll be talking") — it's a deliberate speech pattern.
2. Preserve tsukkomi (self-directed comedic retorts). When a host catches themselves and calls it out (e.g., お前かい), translate the comedic self-awareness, not just the surface meaning.
3. Song titles must be translated exactly as they appear — do not paraphrase, add words, or swap nouns ("painting" vs "drawing" matters). If unsure, transliterate rather than guess.
4. 特訓前/特訓後 are "untrained/trained" (e.g., "untrained art", "the trained version"). Never use ML-flavored variants like "pre-trained/post-trained" or "before/after training".
5. Vocaloid character names (MEIKO, KAITO, MIKU, RIN, LEN, LUKA) are ALWAYS ALL CAPS in English. 咲子 in Vocaloid context is MEIKO.
6. Producer/artist names (aqu3ra, MARETU, chouchou-P, Ayase) use their official Latin stylization — numerals-for-letters, lowercase, trailing -P. Never add Japanese honorifics. If you can't identify the canonical spelling, leave the original katakana rather than guessing a romanization.
7. Brand capitalization is non-negotiable: ProSeka (capital S), SEKAI (all caps).
8. Event titles and song titles must be wrapped in double quotes when mentioned by name (e.g., "Colors of Pure Sense", "The Name of Your Drawing"). Do not italicize them.
9. Unit names (MORE MORE JUMP!, Leo/need, etc.) are NOT quoted. Only event stories and songs get quotes.
"""

vocab = [
    # --- Game ---
    "プロセカ",
    "プロジェクトセカイ",
    "カラフルステージ",
    "初音ミク",

    # --- Units ---
    "レオニード",
    "Leo/need",
    "モア・モア・ジャンプ！",
    "MORE MORE JUMP!",
    "ビビッドバッドスクワッド",
    "Vivid BAD SQUAD",
    "ワンダーランズ×ショウタイム",
    "Wonderlands x Showtime",
    "25時、ナイトコードで。",
    "Nightcord at 25:00",

    # --- Unit Abbreviations ---
    "レオニ",
    "モモジャン",
    "ビビバス",
    "ワンダショ",
    "ニーゴ",

    # --- Virtual Singers ---
    "初音ミク",
    "鏡音リン",
    "鏡音レン",
    "巡音ルカ",
    "MEIKO",
    "KAITO",

    # --- Game Terms ---
    "セカイ",
    "断片セカイ",
    "イベントストーリー",
    "書き下ろし楽曲",
    "バーチャルシンガー",
    "ファンフェスタ",
    "感謝祭",
    "特訓前",
    "特訓後",

    # --- Schools ---
    "宮益坂女子学園",
    "東尾",

    # --- Fan Jargon ---
    "コニーゴ",

    # --- Listener Mail Terms ---
    "おたより",
    "ラジオネーム",
    "ペンネーム",
    "メッセージ",
]

[glossary]
"プロセカ" = "ProSeka"
"セカイ" = "SEKAI"
"断片セカイ" = "Fragment SEKAI"
"バーチャルシンガー" = "Virtual Singer"
"ファンフェスタ" = "fan festa"
# NOT "Thanksgiving" — プロセカ感謝祭 is the game's fan appreciation event, and the
# translator rendered it "Thanksgiving" four times in Sekaraji ep 72 without this.
# Keep the value a bare term: a parenthetical gloss here gets emitted verbatim
# into the subtitle.
"感謝祭" = "Kanshasai"
"プロセカ感謝祭" = "ProSeka Kanshasai"
"ワンダーホイ" = "Wonderhoi!"

# Unit abbreviations. The Japanese colloquial short form maps to the English
# community short form — NOT to a transliteration of the Japanese. English-speaking
# ProSeka spaces say MMJ and N25, never "Momojan" or "Niigo".
"レオニ" = "Leo/need"
"モモジャン" = "MMJ"
"ビビバス" = "VBS"
"ワンダショ" = "WxS"
"ニーゴ" = "N25"

# Fan greetings are the exception: they are coined catchphrases, so they stay
# transliterated and lowercase. subtitle_style_rules.md lists kon-niigo under
# "coined catchphrases — plain". Do not "fix" these to the abbreviations above.
"コンニード" = "kon-needo"
"コンモア" = "kon-more"
"コンニーゴ" = "kon-niigo"
"宮益坂女子学園" = "Miyamasuzaka Girls Academy"
"東尾" = "Toubi"
"特訓前" = "untrained"
"特訓後" = "trained"
"コニーゴ" = "kon-niigo"
"初音ミク" = "Hatsune Miku"
"鏡音リン" = "Kagamine Rin"
"鏡音レン" = "Kagamine Len"
"巡音ルカ" = "Megurine Luka"
"咲子" = "MEIKO"

# ASR repairs. Keep this list SHORT and add only what measurement justifies.
#
# Measured 2026-08-29 on Sekaraji ep 72: repairing mangled proper nouns changed the
# ENGLISH almost not at all. Translating 8 lines with ASR errors (本泉梨花 for 本泉莉奈,
# 暁絵名 for 東雲絵名, 日野守雫 for 日野森雫, 2号 for ニーゴ) against the repaired
# versions gave 6/8 byte-identical output, and the 2 that differed were incidental
# wording, not names. A raw-vs-raw control gave 0/8, so that is signal, not sampling
# noise. Every proper noun came out correct from the mangled Japanese, because the
# speaker map and the cast roster in the prompt are enough to recover them.
#
# The glossary also does NOT need the canonical term to be present: with source text
# reading 2号, the output tracked the glossary value for ニーゴ exactly (N25 / Niigo /
# Nightcord, 3 for 3). It is a prompt instruction the model applies semantically, not a
# lookup table.
#
# So a normalizer term earns its place when the JAPANESE artifact matters — original.ass
# is committed and drives the bilingual view and the review report, and nobody wants to
# read a host's name spelled as a different person — or when a term has no contextual
# support to be recovered from (a song title, a one-off place name, a guest).
[[format.normalizer.terms]]
value = "ニーゴ"
explanation = "Unit abbreviation for 25時、ナイトコードで。 It is a homophone of 2号, and Chirp 3 transcribes it that way — observed 5 times in Sekaraji ep 72 (2号はあんまり踊らない, 2号も4人揃う). Also seen as 二号, ニーゴー. Do NOT correct コンニーゴ or ニーゴーゴー, which are separate coined terms."

[format.normalizer]
engine = "llm"
provider = "google-vertex"
# Was gemini-3.1-flash-lite-preview, which now 404s and takes the format step down with
# it. gemini-2.5-flash-lite is what this branch defaults classification and normalizer
# extensions to.
model = "gemini-2.5-flash-lite"
reasoning_effort = "minimal"
allow_llm_correction = true
