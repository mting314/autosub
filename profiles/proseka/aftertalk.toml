[format.normalizer]
engine = "llm"
provider = "google-vertex"
model = "gemini-3.1-flash-lite-preview"
reasoning_effort = "minimal"
allow_llm_correction = true

[[corners]]
name = "Story Watchalong"
description = "Host watches selected visual novel story scenes in picture-in-picture, reacting live over the gameplay footage. This is a passive watchalong — the host comments on what's on screen in real time, not a discussion or analysis of the story. Story discussion (e.g. talking about themes, plot points, impressions) is a separate topic and should NOT be marked as Story Watchalong."
cues = [
    "語りたいシーンをピックアップ",
    "一緒に見ていきましょう",
    "ストーリーを見ながら",
    "ゲームの方でまた改めて見ていただければ",
]

[[corners]]
name = "Card Illustrations"
description = "Host reviews event card art, comparing before and after training illustrations. Lines discuss card art, expressions, outfits, and training upgrades."
cues = [
    "カードイラストを見ていきましょう",
    "今回のイベントのカードを見ていきましょう",
    "イラストコーナー",
    "カードイラスト",
]

[[corners]]
name = "Song Watchalong"
description = "Host watches and reacts to the event's music video (3DMV or 2DMV). Lines discuss choreography, camera angles, character expressions, song impressions, and composer/artist credits."
cues = [
    "3DMVを見ていきましょう",
    "2DMVを見ていきましょう",
    "MVを見ていきましょう",
    "MVご覧ください",
    "MVを見てみましょう",
    "楽曲についてお話",
    "書き下ろしいただいた",
]

[[corners]]
name = "Fan Letter Corner"
description = "Host reads and responds to fan letters/messages submitted via Discord and email. Lines include pen names, fan comments, and the host's reactions."
cues = [
    "おたよりコーナー",
    "おたよりを紹介",
    "おたよりを読んでいきましょう",
    "皆さんからいただいたおたより",
]
